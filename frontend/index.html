<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- the FlowState mark: three wave bands sloping down-right, ink on paper
         (inverted when the OS is dark); same geometry as Layout.tsx BrandMark -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cstyle%3Erect%7Bfill:%2321201c%7Dpath%7Bstroke:%23fdfdfc%7D@media (prefers-color-scheme:dark)%7Brect%7Bfill:%23eeeeec%7Dpath%7Bstroke:%23191918%7D%7D%3C/style%3E%3Crect width='20' height='20' rx='5'/%3E%3Cpath d='M4 8 L9 13 M7 5 L14 12 M11 4 L16 9' fill='none' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>FlowState</title>
    <script>
      try {
        var t = localStorage.getItem('flowstate.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      html { background: #f9f9f8; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #111110; } }
      html[data-theme='dark'] { background: #111110; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
