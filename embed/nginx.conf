server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css application/octet-stream image/svg+xml;

    # Embedding is the point: allow any parent frame (no X-Frame-Options).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors *" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed bundles: cache forever. Data pack: a day (it only changes with a redeploy).
    location /assets/ { expires 1y; }
    location /data/ { expires 1d; }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
