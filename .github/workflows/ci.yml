name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck (strict scope)
        run: |
          uv run mypy packages/flowstate_core/flowstate_core \
                      packages/controllers/controllers \
                      packages/validation/validation

      - name: Unit + integration tests (coverage gate 85%)
        run: uv run pytest -m "not slow" --cov --cov-report=term

  docker:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t flowstate:${{ github.ref_name }} .
