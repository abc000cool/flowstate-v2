name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual runs (gh workflow run ci.yml --ref <branch|tag>) exist so the
  # image build can be exercised without cutting a tag.
  workflow_dispatch:

# One run per ref at a time; a newer push waits and replaces any older run still queued, so
# overlapping pushes no longer run side by side (2026-09-24).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --dev

      # The Redis-backed queue and the RQ worker entrypoint (the deployed
      # path: docker-compose runs FLOWSTATE_QUEUE=redis + `python -m
      # api.worker`) are exercised by tests that spawn their own
      # redis-server on a free port; without the binary they would skip and
      # CI would stay green while that path is untested, so
      # tests/test_api/test_redis_queue.py refuses to skip when CI is set.
      - name: Install redis-server (redis queue + worker tests)
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck (strict scope)
        run: |
          uv run mypy packages/flowstate_core/flowstate_core \
                      packages/controllers/controllers \
                      packages/validation/validation

      # COVERAGE_CORE=sysmon: Python 3.12's sys.monitoring tracer. The default settrace tracer
      # made the SUMO-driving weave tests ~36x slower (one file 499 s against 14 s, same
      # coverage; 2026-09-24), which pushed this job to 40-45 min against its 45-min limit: seven
      # of the ten runs created between 23:41 and 02:49 UTC that day ended "cancelled" by the
      # timeout. With it the whole suite ran in 133 s locally at the same total (95.66 %).
      - name: Unit + integration tests (coverage gate 85%)
        env:
          COVERAGE_CORE: sysmon
        run: uv run pytest -m "not slow" --cov --cov-report=term --durations=15

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [frontend, embed]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck, test, build
        run: |
          npx tsc --noEmit -p .
          npm test
          npm run build

  docker:
    # Release tags (v*) and manual dispatches build the image. Until
    # 2026-09-20 the push trigger listed only main, so no tag ever
    # reached this job: v2.1.0 and v2.2.0 shipped without a CI image build.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t flowstate:${{ github.ref_name }} .
