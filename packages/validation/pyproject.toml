[project]
name = "validation"
version = "2.0.0"
description = "FlowState v2 — metrics, wave detection, FHWA criteria, auto-report"
requires-python = ">=3.12,<3.13"
dependencies = ["flowstate-core", "numpy>=2.0", "scipy>=1.14", "pandas>=2.2", "matplotlib>=3.9", "jinja2>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["validation"]
