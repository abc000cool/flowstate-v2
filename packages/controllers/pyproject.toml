[project]
name = "controllers"
version = "2.0.0-dev"
description = "FlowState v2 — pure-function wave-dampening controller library"
requires-python = ">=3.12,<3.13"
dependencies = ["flowstate-core", "numpy>=2.0", "gymnasium>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["controllers"]
