[project]
name = "microsim"
version = "2.0.0-dev"
description = "FlowState v2 — SUMO+IDM microscopic tier (scenario builder, runner, outputs)"
requires-python = ">=3.12,<3.13"
dependencies = ["flowstate-core", "controllers", "eclipse-sumo==1.27.1", "libsumo==1.27.1", "traci==1.27.1", "sumolib==1.27.1", "numpy>=2.0", "pandas>=2.2", "pyarrow>=18.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["microsim"]
