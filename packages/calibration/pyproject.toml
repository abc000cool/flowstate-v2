[project]
name = "calibration"
version = "2.0.0"
description = "FlowState v2 — FD, IDM and demand calibration from public traffic data"
requires-python = ">=3.12,<3.13"
dependencies = ["flowstate-core", "numpy>=2.0", "scipy>=1.14", "pandas>=2.2", "pyarrow>=18.0,!=24.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calibration"]
