[project]
name = "flowstate-core"
version = "2.0.0-dev"
description = "FlowState v2 — shared types, config schema, units, RNG, constants"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10", "numpy>=2.0", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowstate_core"]
