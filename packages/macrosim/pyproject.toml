[project]
name = "macrosim"
version = "2.0.0"
description = "FlowState v2 — LWR/CTM macroscopic screening tier (ported v1 engine)"
requires-python = ">=3.12,<3.13"
dependencies = ["flowstate-core", "numpy>=2.0", "numba>=0.61"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["macrosim"]
