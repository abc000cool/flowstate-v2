[project]
name = "api"
version = "2.0.0-dev"
description = "FlowState v2 — FastAPI service + RQ job layer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flowstate-core",
    "macrosim",
    "microsim",
    "validation",
    "calibration",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "rq>=2.1",
    "redis>=5.2",
    "pydantic>=2.10",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
