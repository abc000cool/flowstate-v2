[project]
name = "api"
version = "2.0.0-dev"
description = "FlowState v2 — FastAPI service + RQ job layer"
requires-python = ">=3.12,<3.13"
dependencies = ["flowstate-core", "fastapi>=0.115", "uvicorn>=0.34", "rq>=2.1", "redis>=5.2", "pydantic>=2.10", "python-multipart>=0.0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
