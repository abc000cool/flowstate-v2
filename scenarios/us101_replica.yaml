# us101_replica — NGSIM US-101 southbound study section (M2, CLAUDE.md §6).
#
# Corridor replica of the ~640 m, 5-mainline-lane US-101 site in Los Angeles
# (NGSIM, 2005-06-15 AM peak). Fleet parameters draw from the Phase-2 IDM
# population calibration artifact (artifacts/idm_us101.json — fitted on 2,452
# leader-follower episodes from the same site; the artifact's mean/cov
# override the scalar fleet fields, docs/CONTRACTS.md §2). Inflow steps are
# the deduplicated upstream mainline boundary counts from
# artifacts/demand_us101.json (5-min windows, total across 5 lanes), shifted
# by the 180 s warmup: sim t = 180 s corresponds to the period-1 recording
# start (07:49:39.7 PDT); duration 1133 s = 180 s warmup + the 952.8 s
# period-1 recording span.
#
# Known limitations (documented in docs/M2_RESULTS.md): the replica has no
# auxiliary lane and no on/off ramps, so the ~6% of real vehicles that
# entered via the on-ramp (lane 7, ~150-165 m) are not injected, and the site's heavy
# congestion partly originated downstream of the study section — expect the
# replica to run less congested than the recording until M3 adds a
# downstream boundary condition.
#
# M3 demand-realization fix (measured on SUMO 1.27.1, seed 42, full 1133 s):
# M2's ~73% insertion ceiling (docs/M2_RESULTS.md §6/§7.7) is closed by the
# multi-lane insertion scheme in microsim.vehicles.write_corridor_routes —
# per-vehicle departLane round-robin across the 5 lanes in departure order,
# departPos="base" (entry-edge start), departSpeed="avg" (prevailing lane
# speed). No SUMO safety check is bypassed and no SUMO option changed; all
# insertion stays on the 640 m entry-buffer edge upstream of the measured
# span (x in [640, 1280] m in run coordinates), so measured-span physics is
# untouched. Realized with the calibrated fleet: 2,591/2,592 planned
# insertions (99.96%); realized inflow over the measurement span during the
# post-warmup window = 2.278 veh/s vs 2.287 veh/s planned average (99.6%),
# with per-5-min span-entry counts tracking the planned steps (traversal lag
# ~20-30 s). Root cause of the old ceiling: full-speed free-position
# insertion needs a leader+follower secure-gap slot of ~2*(s0 + v*T) ~ 85 m
# per vehicle, which the entry edge cannot supply at 2.29 veh/s.
name: us101_replica
tier: micro
network:
  kind: corridor
  length_m: 640.0
  lanes: 5
  inflow:
    - [0.0, 2.437]     # warmup + wall 0-300 s window (8772 veh/h over 5 lanes)
    - [480.0, 2.357]   # wall 300-600 s
    - [780.0, 2.013]   # wall 600-900 s
    - [1080.0, 2.150]  # wall 900 s -> period-1 end (952.8 s)
fleet:
  model: IDM
  idm_calibration: artifacts/idm_us101.json
av:
  penetration: 0.0
  compliance: 1.0
  controller: null
  controller_params: {}
sim:
  duration_s: 1133.0
  step_length_s: 0.5
  action_step_s: 0.5
  warmup_s: 180.0
  output_hz: 2.0
perturbation: null
seed: 42
replicates: 20
