# gallery_i24_nashville — I-24 westbound near Nashville, TN (M5 demo gallery).
#
# WHAT THIS IS: a demonstration of the `osm_generic` "any city" onboarding
# pipeline (CLAUDE.md §3.2.4) on a real corridor: an OSM bbox around the
# I-24 MOTION testbed miles SE of Nashville → motorway-only Overpass extract
# (scripts/fetch_gallery_osm.py; data/osm/i24_nashville.osm, gitignored) →
# netconvert import → westbound mainline chain (8 edges, ~6.6 km, 4-5 lanes)
# → runnable SUMO scenario. Corridor edge ids below are raw OSM way ids from
# the extract, pruned/pinned by microsim.networks.osm_import.
#
# WHAT THIS IS NOT: a validated or calibrated corridor. The demand below is
# UNCALIBRATED — a flat, plausible-order-of-magnitude load chosen for the
# demo, not fitted to any observed counts. The fleet draws from the M2
# US-101 IDM population calibration (artifacts/idm_us101.json — a different
# site: congested Los Angeles freeway, raw-NGSIM caveats in
# docs/M2_RESULTS.md §7). One replicate, no CIs: nothing here supports a
# quantitative claim (CLAUDE.md §0.6 applies to headline results; this is an
# onboarding demo, and the gallery README says so). The true I-24 validation
# flagship (`i24_replica`, boundary flows from I-24 MOTION data) remains
# future work.
name: gallery_i24_nashville
tier: micro
network:
  kind: osm
  osm_file: data/osm/i24_nashville.osm
  corridor_edges:  # westbound mainline, upstream (SE) -> downstream (NW)
    - "635462235"
    - "173720368"
    - "27828382"
    - "974949114"
    - "977008894"
    - "977008893"
    - "977008892"
    - "977008891"
  inflow:
    - [0.0, 1.25]  # 4500 veh/h total over 4-5 lanes — uncalibrated demo demand
fleet:
  model: IDM
  idm_calibration: artifacts/idm_us101.json
av:
  penetration: 0.0
  compliance: 1.0
  controller: null
  controller_params: {}
sim:
  duration_s: 600.0
  step_length_s: 0.5
  action_step_s: 0.5
  warmup_s: 60.0
  output_hz: 2.0
perturbation: null
seed: 42
replicates: 1
