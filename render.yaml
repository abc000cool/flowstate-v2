# Render Blueprint: the embeddable simulation as a static site (no server).
# Connect the repo in the Render dashboard → "New Blueprint"; it reads this file.
services:
  - type: web
    name: flowstate-sim
    runtime: static
    rootDir: embed
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors *"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
