[project]
name = "flowstate"
version = "2.0.0"
description = "FlowState v2 — calibrated corridor digital twins for studying and dissipating stop-and-go traffic waves"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
readme = "README.md"
dependencies = [
    "flowstate-core",
    "macrosim",
    "microsim",
    "controllers",
    "calibration",
    "validation",
    "api",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
flowstate-core = { workspace = true }
macrosim = { workspace = true }
microsim = { workspace = true }
controllers = { workspace = true }
calibration = { workspace = true }
validation = { workspace = true }
api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.9",
    "mypy>=1.14",
    "pandas-stubs",
    "types-pyyaml",
    "fpdf2>=2.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
# E501: line length handled by formatter. RUF001-003: Greek/math unicode
# (σ, ρ, Δ, ×) is intentional notation in a traffic-physics codebase.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = [
    "flowstate_core", "macrosim", "microsim", "controllers",
    "calibration", "validation", "api",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

# mypy --strict scope per CLAUDE.md §2: flowstate_core, controllers, validation
[[tool.mypy.overrides]]
module = ["flowstate_core.*", "controllers.*", "validation.*"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs a real SUMO simulation (slower; needs eclipse-sumo)",
    "slow: long-running physics or sweep test",
]
addopts = "-ra --import-mode=importlib"

[tool.coverage.run]
source = [
    "packages/controllers/controllers",
    "packages/macrosim/macrosim",
    "packages/validation/validation",
    "packages/calibration/calibration",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
